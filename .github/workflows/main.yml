name: Build Mises Lite Browser APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Ekstrak File Project ZIP
        run: |
          ZIP_NAME=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP_NAME" ]; then
            echo "Error: File zip tidak ditemukan!"
            exit 1
          fi
          echo "Mengekstrak file: $ZIP_NAME"
          unzip -o "$ZIP_NAME" -d .

      - name: 3. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Compile APK dengan Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          arguments: assembleDebug --stacktrace

      - name: 5. Simpan File APK Siap Download
        uses: actions/upload-artifact@v4
        with:
          name: Mises-Lite-Browser-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
